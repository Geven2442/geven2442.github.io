<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尼好！</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffb7b2;
            --secondary-color: #ff9a9e;
            --text-color: #333;
            --bg-color: #fdfbfb;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #ebedee 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem 4rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
            max-width: 90%;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-top: 1rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(to right, var(--secondary-color), var(--primary-color));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .time-container {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            border: 1px solid rgba(255, 183, 178, 0.3);
            display: inline-block;
        }

        .date-display {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 2rem;
            font-weight: bold;
            color: var(--secondary-color);
            font-variant-numeric: tabular-nums; /* 讓數字等寬，避免時間跳動時寬度改變 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 183, 178, 0.2);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }

        /* 分別設定不同圓圈的大小與動畫延遲 */
        .circles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }
        
        /* 隱藏的驚喜訊息容器 */
        #message-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #fff0f0;
            border: 1px solid #ffd0d0;
            color: #d85a5a;
            animation: fadeIn 0.5s ease-out;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .container { padding: 2rem; }
        }
    </style>
</head>
<body>

    <ul class="circles">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="container">
        <h1>尼好！</h1>
        <p>很高興遇見你！<br>這是一個為你準備的小小問候網頁。</p>
        
        <div class="time-container">
            <div class="date-display" id="date-display">正在載入日期...</div>
            <div class="time-display" id="time-display">00:00:00</div>
        </div>
        <br>

        <button class="btn" onclick="showMessage()">點擊我！</button>
        
        <div id="message-box">
            ✨ 祝你有個美好的一天！繼續保持開心的笑容喔！ ✨
        </div>
    </div>

    <script>
        // 處理按鈕點擊事件，顯示隱藏的訊息
        function showMessage() {
            const messageBox = document.getElementById('message-box');
            const btn = document.querySelector('.btn');
            
            if (messageBox.style.display === 'none' || messageBox.style.display === '') {
                messageBox.style.display = 'block';
                btn.textContent = '收起訊息';
                // 產生隨機的五彩碎紙效果 (簡易版)
                createConfetti();
            } else {
                messageBox.style.display = 'none';
                btn.textContent = '點擊我！';
            }
        }

        // 簡易的粒子特效函數
        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.top = '-10px';
                confetti.style.borderRadius = '50%';
                confetti.style.zIndex = '1000';
                
                document.body.appendChild(confetti);

                const animationDuration = Math.random() * 2 + 1;
                
                // 使用 Web Animations API
                confetti.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*200 - 100}px, ${window.innerHeight}px, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: animationDuration * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)'
                }).onfinish = () => confetti.remove();
            }
        }

        // 更新時間與日期的函數
        function updateTime() {
            const now = new Date();
            
            // 格式化時間 (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            
            // 格式化日期 (YYYY年MM月DD日 星期X)
            const year = now.getFullYear();
            const month = now.getMonth() + 1; // 月份從 0 開始
            const date = now.getDate();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dayName = days[now.getDay()];
            const dateString = `${year}年${month}月${date}日 星期${dayName}`;

            // 更新 DOM
            document.getElementById('time-display').textContent = timeString;
            document.getElementById('date-display').textContent = dateString;
        }

        // 初始呼叫一次，避免畫面載入時出現延遲
        updateTime();
        
        // 設定每秒更新一次時間
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
