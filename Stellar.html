<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際拾荒者</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary-color: #66fcf1;
            --secondary-color: #45a29e;
            --text-color: #c5c6c7;
            --danger-color: #ff3b30;
            --crystal-color: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 1000px;
            box-shadow: 0 0 50px rgba(102, 252, 241, 0.2);
            overflow: hidden;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            text-shadow: 0 0 10px var(--primary-color);
        }

        .score-container, .energy-container {
            background: rgba(31, 40, 51, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .energy-bar-bg {
            width: 100px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3b30, #ffcc00, #34c759);
            transition: width 0.2s ease;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color);
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px var(--primary-color); transform: scale(1); }
            100% { text-shadow: 0 0 25px var(--primary-color), 0 0 50px var(--secondary-color); transform: scale(1.05); }
        }

        .message {
            font-size: 1.5rem;
            margin-bottom: 40px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        /* 按鈕容器與樣式 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 250px;
        }

        .btn {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
            width: 100%;
        }

        .btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.6);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .controls-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--secondary-color);
            text-align: center;
        }
        
        .controls-hint i {
            margin: 0 5px;
        }

        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        #joystick-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            pointer-events: auto;
            z-index: 5;
            display: none;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2rem; }
            .message { font-size: 1.2rem; }
            .hud { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="stars-bg" id="stars-bg"></div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div id="joystick-zone"></div>

        <div id="ui-layer">
            <div class="hud">
                <div class="score-container">
                    <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i>
                    <span id="score">0</span>
                </div>
                <div class="energy-container">
                    <i class="fa-solid fa-bolt" style="color: var(--danger-color);"></i>
                    <div class="energy-bar-bg">
                        <div class="energy-bar-fill" id="energy-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="start-screen" class="overlay">
            <h1 class="title">Stellar<br>Scavenger</h1>
            <p class="message">在星際廢墟中收集能量水晶。<br>避開致命的小行星！</p>
            <div class="btn-group">
                <button class="btn" id="start-btn">啟動引擎 <i class="fa-solid fa-rocket"></i></button>
            </div>
            <div class="controls-hint">
                <p>桌面: <i class="fa-solid fa-caret-left"></i> <i class="fa-solid fa-caret-right"></i> <i class="fa-solid fa-caret-up"></i> <i class="fa-solid fa-caret-down"></i> 或 游標移動</p>
                <p>手機: 在螢幕下半部滑動控制方向</p>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 class="title" style="color: var(--danger-color); text-shadow: 0 0 20px var(--danger-color);">船體破裂</h1>
            <p class="message">收集到的水晶: <span id="final-score" style="color: var(--crystal-color); font-weight: bold; font-size: 2rem;">0</span></p>
            <div class="btn-group">
                <button class="btn" id="restart-btn" style="border-color: var(--danger-color); color: var(--danger-color);">重新部署 <i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn" id="home-btn" style="border-color: var(--text-color); color: var(--text-color);">回主畫面 <i class="fa-solid fa-house"></i></button>
            </div>
        </div>

        <div id="game-win-screen" class="overlay hidden">
            <h1 class="title" style="color: #34c759; text-shadow: 0 0 20px #34c759;">躍遷成功</h1>
            <p class="message">能量滿載，你成功逃離了小行星帶！<br>最終得分: <span id="win-score" style="color: var(--crystal-color); font-weight: bold; font-size: 2rem;">0</span></p>
            <div class="btn-group">
                <button class="btn" id="win-restart-btn" style="border-color: #34c759; color: #34c759;">再次挑戰 <i class="fa-solid fa-space-awesome"></i></button>
                <button class="btn" id="win-home-btn" style="border-color: var(--text-color); color: var(--text-color);">回主畫面 <i class="fa-solid fa-house"></i></button>
            </div>
        </div>
    </div>

    <script>
        // 獲取 DOM 元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const energyFill = document.getElementById('energy-fill');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const joystickZone = document.getElementById('joystick-zone');
        
        // 新增畫面與按鈕的 DOM 元素
        const gameWinScreen = document.getElementById('game-win-screen');
        const winScoreElement = document.getElementById('win-score');
        const winRestartBtn = document.getElementById('win-restart-btn');
        const homeBtn = document.getElementById('home-btn');
        const winHomeBtn = document.getElementById('win-home-btn');

        // 遊戲狀態變量
        let gameLoopId;
        let isPlaying = false;
        let score = 0;
        let energy = 100;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        // 畫布尺寸調整
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 工具函數：隨機數
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 工具函數：碰撞檢測 (圓形)
        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < obj1.radius + obj2.radius;
        }

        class Star {
            constructor() {
                this.reset();
                this.y = random(0, canvas.height);
            }
            reset() {
                this.x = random(0, canvas.width);
                this.y = -10;
                this.size = random(0.5, 2.5);
                this.speed = this.size * random(1, 3);
                this.color = `rgba(255, 255, 255, ${random(0.3, 0.8)})`;
            }
            update() {
                this.y += this.speed * (isPlaying ? (1 + score/50) : 1);
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Player {
            constructor() {
                this.radius = 15;
                this.reset();
                this.targetX = this.x;
                this.targetY = this.y;
                this.speed = 0.15;
                this.thrustFrames = 0;
            }
            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height * 0.8;
                this.targetX = this.x;
                this.targetY = this.y;
                this.vx = 0;
                this.vy = 0;
            }
            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;

                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                
                this.thrustFrames++;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                const tilt = (this.targetX - this.x) * 0.05;
                ctx.rotate(tilt);

                ctx.beginPath();
                ctx.moveTo(0, -this.radius * 1.5);
                ctx.lineTo(this.radius, this.radius);
                ctx.lineTo(0, this.radius * 0.5);
                ctx.lineTo(-this.radius, this.radius);
                ctx.closePath();
                
                const gradient = ctx.createLinearGradient(0, -this.radius*1.5, 0, this.radius);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#66fcf1');
                gradient.addColorStop(1, '#45a29e');
                
                ctx.fillStyle = gradient;
                ctx.shadowColor = '#66fcf1';
                ctx.shadowBlur = 15;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                if (this.thrustFrames % 4 < 2) {
                    ctx.beginPath();
                    ctx.moveTo(-this.radius * 0.6, this.radius * 0.8);
                    ctx.lineTo(0, this.radius * 1.8 + random(0, 10));
                    ctx.lineTo(this.radius * 0.6, this.radius * 0.8);
                    ctx.fillStyle = 'rgba(255, 150, 0, 0.8)';
                    ctx.shadowColor = '#ff3b30';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                }
                
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 10;
                ctx.fill();

                ctx.restore();
            }
        }

        class Asteroid {
            constructor() {
                this.radius = random(15, 35);
                this.x = random(this.radius, canvas.width - this.radius);
                this.y = -this.radius - 50;
                this.speedY = random(2, 5) * difficultyMultiplier;
                this.speedX = random(-1, 1) * difficultyMultiplier;
                this.rotation = random(0, Math.PI * 2);
                this.rotationSpeed = random(-0.05, 0.05);
                this.vertices = Math.floor(random(5, 9));
                this.offsets = [];
                for (let i = 0; i < this.vertices; i++) {
                    this.offsets.push(random(0.7, 1.1));
                }
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;

                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;

                if (this.y > canvas.height + this.radius) {
                    this.markedForDeletion = true;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.beginPath();
                for (let i = 0; i < this.vertices; i++) {
                    const angle = (i / this.vertices) * Math.PI * 2;
                    const r = this.radius * this.offsets[i];
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                ctx.fillStyle = '#5c6066'; 
                ctx.shadowColor = '#2b3036';
                ctx.shadowBlur = 5;
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(0, -this.radius * 0.8);
                ctx.lineTo(this.radius * 0.4, 0);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }

        class Crystal {
            constructor() {
                this.radius = 12;
                this.x = random(this.radius, canvas.width - this.radius);
                this.y = -this.radius;
                this.speedY = random(2, 4) * difficultyMultiplier;
                this.type = Math.random() > 0.9 ? 'special' : 'normal'; 
                this.markedForDeletion = false;
                this.rotation = 0;
            }
            update() {
                this.y += this.speedY;
                this.rotation += 0.05;
                if (this.y > canvas.height + this.radius) {
                    this.markedForDeletion = true;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius * 0.7, 0);
                ctx.lineTo(0, this.radius);
                ctx.lineTo(-this.radius * 0.7, 0);
                ctx.closePath();

                const color = this.type === 'special' ? '#ff3b30' : '#ffd700';
                const glow = this.type === 'special' ? '#ff8a80' : '#fff9c4';

                ctx.fillStyle = color;
                ctx.shadowColor = glow;
                ctx.shadowBlur = 15;
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(0, -this.radius * 0.6);
                ctx.lineTo(this.radius * 0.3, 0);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }
        
        class Particle {
            constructor(x, y, color, isExplosion) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = random(2, 5);
                const angle = random(0, Math.PI * 2);
                const speed = isExplosion ? random(2, 8) : random(1, 4);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = random(0.02, 0.05);
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                if (this.life <= 0) {
                    this.markedForDeletion = true;
                }
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        let player = new Player();
        let backgroundStars = Array.from({length: 100}, () => new Star());
        let asteroids = [];
        let crystals = [];
        let particles = [];

        // 輸入處理
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        // 滑鼠控制
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
            player.targetY = e.clientY - rect.top;
        });

        // 觸控控制
        let touchStartX, touchStartY;
        let playerStartTargetX, playerStartTargetY;
        
        window.addEventListener('touchstart', function detectTouch() {
            joystickZone.style.display = 'block';
            window.removeEventListener('touchstart', detectTouch);
        }, { once: true });

        joystickZone.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            playerStartTargetX = player.targetX;
            playerStartTargetY = player.targetY;
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            const sensitivity = 1.5; 
            player.targetX = playerStartTargetX + deltaX * sensitivity;
            player.targetY = playerStartTargetY + deltaY * sensitivity;
        }, { passive: false });


        function createParticles(x, y, color, isExplosion, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, isExplosion));
            }
        }

        function updateEnergyUI() {
            energyFill.style.width = `${Math.max(0, energy)}%`;
            if (energy < 30) {
                energyFill.style.background = 'var(--danger-color)';
                energyFill.style.boxShadow = '0 0 10px var(--danger-color)';
            } else {
                energyFill.style.background = 'linear-gradient(90deg, #ff3b30, #ffcc00, #34c759)';
                energyFill.style.boxShadow = 'none';
            }
        }

        function spawnEntities() {
            const asteroidSpawnRate = Math.max(20, 60 - score / 100);
            if (frameCount % Math.floor(asteroidSpawnRate) === 0) {
                asteroids.push(new Asteroid());
            }

            if (frameCount % 45 === 0) {
                crystals.push(new Crystal());
            }
        }

        function update() {
            if (!isPlaying) return;

            frameCount++;
            difficultyMultiplier = 1 + score / 1000;

            const speed = 7;
            if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.targetX += speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.targetY += speed;

            player.update();
            
            if (frameCount % 60 === 0) {
                energy -= 2 * difficultyMultiplier;
                updateEnergyUI();
            }

            if (energy <= 0) {
                gameOver();
                return;
            }

            spawnEntities();

            backgroundStars.forEach(star => star.update());

            for (let i = asteroids.length - 1; i >= 0; i--) {
                let ast = asteroids[i];
                ast.update();
                
                if (checkCollision(player, ast)) {
                    createParticles(player.x, player.y, '#66fcf1', true, 30);
                    createParticles(ast.x, ast.y, '#5c6066', true, 20);
                    
                    energy -= 30;
                    
                    canvas.style.transform = `translate(${random(-5,5)}px, ${random(-5,5)}px)`;
                    setTimeout(() => canvas.style.transform = 'none', 100);
                    
                    updateEnergyUI();
                    ast.markedForDeletion = true;
                    
                    if (energy <= 0) {
                        gameOver();
                        return;
                    }
                }
                
                if (ast.markedForDeletion) {
                    asteroids.splice(i, 1);
                }
            }

            for (let i = crystals.length - 1; i >= 0; i--) {
                let cry = crystals[i];
                cry.update();
                
                if (checkCollision(player, cry)) {
                    createParticles(cry.x, cry.y, cry.type === 'special' ? '#ff3b30' : '#ffd700', false, 15);
                    score += cry.type === 'special' ? 50 : 10;
                    scoreElement.innerText = score;
                    
                    energy = Math.min(100, energy + (cry.type === 'special' ? 25 : 10));
                    updateEnergyUI();
                    
                    cry.markedForDeletion = true;

                    if (score >= 500) {
                        gameWin();
                        return;
                    }
                }
                
                if (cry.markedForDeletion) {
                    crystals.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].markedForDeletion) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            backgroundStars.forEach(star => star.draw());

            if (isPlaying) {
                particles.forEach(p => p.draw());
                crystals.forEach(c => c.draw());
                asteroids.forEach(a => a.draw());
                player.draw();
            } else {
                 backgroundStars.forEach(star => star.update());
            }
        }

        function gameLoop() {
            update();
            draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function initGame() {
            score = 0;
            energy = 100;
            frameCount = 0;
            difficultyMultiplier = 1;
            scoreElement.innerText = score;
            updateEnergyUI();
            
            player.reset();
            asteroids = [];
            crystals = [];
            particles = [];
        }

        function startGame() {
            initGame();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameWinScreen.classList.add('hidden');
            isPlaying = true;
        }

        function goToHome() {
            // 隱藏結束與勝利畫面，顯示主畫面
            gameOverScreen.classList.add('hidden');
            gameWinScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            
            // 將 UI 數值歸零重置
            scoreElement.innerText = "0";
            energyFill.style.width = "100%";
            energyFill.style.background = 'linear-gradient(90deg, #ff3b30, #ffcc00, #34c759)';
        }

        function gameOver() {
            isPlaying = false;
            finalScoreElement.innerText = score;
            gameOverScreen.classList.remove('hidden');
            
            createParticles(player.x, player.y, '#66fcf1', true, 50);
            createParticles(player.x, player.y, '#ff3b30', true, 50);
            draw();
        }

        function gameWin() {
            isPlaying = false;
            winScoreElement.innerText = score;
            gameWinScreen.classList.remove('hidden');
            
            createParticles(player.x, player.y, '#34c759', true, 80);
            createParticles(player.x, player.y, '#ffd700', true, 80);
            draw();
        }

        // 事件綁定
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        winRestartBtn.addEventListener('click', startGame);
        
        // 綁定回主畫面按鈕
        homeBtn.addEventListener('click', goToHome);
        winHomeBtn.addEventListener('click', goToHome);

        // 啟動初始動畫循環
        gameLoop();

    </script>
</body>
</html>
