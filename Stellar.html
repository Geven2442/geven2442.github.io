<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星際拾荒者 - 終極升級版</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --primary-color: #b388ff; 
            --secondary-color: #7c4dff;
            --text-color: #c5c6c7;
            --danger-color: #ff3b30;
            --crystal-color: #ffd700;
            --shield-color: #00e5ff;
            --magnet-color: #b388ff;
            --laser-color: #ff1744;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: none; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 1000px;
            box-shadow: 0 0 50px rgba(179, 136, 255, 0.2);
            overflow: hidden;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: flex-start; padding: 15px; z-index: 10;
            gap: 10px;
        }

        .hud-header {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #mode-display {
            font-size: 1.3rem; font-weight: 900; color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color); letter-spacing: 2px;
            background: rgba(11, 12, 16, 0.7); padding: 5px 20px; border-radius: 20px; 
            border: 1px solid var(--secondary-color);
            pointer-events: auto;
        }

        .hud {
            display: flex; justify-content: space-between; align-items: flex-start;
            width: 100%; font-size: 1.1rem; font-weight: 700;
        }

        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; }

        .stat-box {
            background: rgba(31, 40, 51, 0.7); padding: 10px 18px;
            border-radius: 30px; border: 1px solid var(--secondary-color);
            display: flex; align-items: center; gap: 10px;
        }

        .energy-bar-bg {
            width: 110px; height: 12px; background: #333;
            border-radius: 6px; overflow: hidden; position: relative;
        }

        .energy-bar-fill {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #ff3b30, #ffcc00, #34c759);
            transition: width 0.2s ease, background 0.3s ease;
        }
        
        .energy-text {
            position: absolute; width: 100%; text-align: center; 
            font-size: 0.65rem; top: 0; line-height: 12px; color: white; text-shadow: 1px 1px 2px black;
        }

        .buffs-container { display: flex; gap: 8px; }
        .buff-icon {
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 0.9rem;
            background: rgba(31, 40, 51, 0.8); border: 2px solid; opacity: 0;
            transition: opacity 0.3s;
        }
        .buff-icon.active { opacity: 1; animation: pulseBuff 1s infinite alternate; }
        .buff-shield { border-color: var(--shield-color); color: var(--shield-color); }
        .buff-magnet { border-color: var(--magnet-color); color: var(--magnet-color); }
        .buff-laser { border-color: var(--laser-color); color: var(--laser-color); }

        @keyframes pulseBuff { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 20; transition: opacity 0.3s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        .title {
            font-size: 3rem; font-weight: 900; color: var(--primary-color);
            text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px;
            text-align: center; text-shadow: 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color);
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { text-shadow: 0 0 10px var(--primary-color); transform: scale(1); }
            100% { text-shadow: 0 0 25px var(--primary-color), 0 0 50px var(--secondary-color); transform: scale(1.05); }
        }

        .btn-group {
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;
        }

        .btn {
            background: transparent; color: var(--primary-color); border: 2px solid var(--primary-color);
            padding: 12px 25px; font-size: 1.1rem; font-family: 'Orbitron', sans-serif;
            font-weight: 700; border-radius: 50px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(179, 136, 255, 0.3);
        }
        .btn:hover { background: var(--primary-color); color: var(--bg-color); box-shadow: 0 0 30px rgba(179, 136, 255, 0.6); transform: translateY(-3px); }
        .btn.gold { color: var(--crystal-color); border-color: var(--crystal-color); box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .btn.gold:hover { background: var(--crystal-color); color: var(--bg-color); box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); }
        .btn.outline { color: var(--text-color); border-color: var(--text-color); box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); }
        .btn.outline:hover { background: var(--text-color); color: var(--bg-color); box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); }

        .shop-panel {
            background: #1f2833; border: 2px solid var(--secondary-color);
            border-radius: 15px; padding: 20px; width: 90%; max-width: 500px;
            box-shadow: 0 0 30px rgba(124, 77, 255, 0.4); max-height: 80%; overflow-y: auto;
        }
        .shop-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--secondary-color); padding-bottom: 15px; margin-bottom: 15px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: #0b0c10; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        .shop-item-info h3 { color: var(--primary-color); font-size: 1.1rem; margin-bottom: 5px; }
        .shop-item-info p { font-size: 0.8rem; color: #aaa; }
        
        @media (max-width: 480px) {
            #ui-layer { padding: 8px; gap: 5px; }
            #mode-display { font-size: 0.95rem; padding: 4px 15px; }
            .hud { font-size: 0.85rem; }
            .stat-box { padding: 6px 12px; gap: 6px; }
            .energy-bar-bg { width: 80px; height: 10px; }
            .energy-text { font-size: 0.55rem; line-height: 10px; }
            .buff-icon { width: 26px; height: 26px; font-size: 0.75rem; }
            .title { font-size: 2.2rem; letter-spacing: 2px; }
            .btn { padding: 10px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="hud-header">
                <div id="mode-display">無盡模式</div>
            </div>
            
            <div class="hud">
                <div class="hud-left">
                    <div class="stat-box">
                        <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i>
                        <span id="score">0</span>
                        <span id="target-score" style="color: #aaa; font-size: 0.75rem; margin-left: 3px; display: none;">/ 500</span>
                        <span id="hud-high-score" style="color: var(--primary-color); font-size: 0.75rem; margin-left: 5px; display: none;">最高: 0</span>
                    </div>
                    <div class="stat-box" style="font-size:0.85rem; padding: 5px 12px;">
                        <i class="fa-solid fa-wallet" style="color: #fff;"></i>
                        <span id="hud-wallet">0</span>
                    </div>
                </div>
                <div class="hud-right" style="align-items: flex-end;">
                    <div style="display: flex; gap: 6px;">
                        <div class="stat-box">
                            <i class="fa-solid fa-bolt" style="color: var(--danger-color);"></i>
                            <div class="energy-bar-bg">
                                <div class="energy-bar-fill" id="energy-fill"></div>
                                <div class="energy-text"><span id="energy-text-val">100</span> / <span id="energy-text-max">100</span></div>
                            </div>
                        </div>
                        <div class="stat-box" id="pause-btn" style="cursor: pointer; padding: 8px 12px; pointer-events: auto;">
                            <i class="fa-solid fa-pause"></i>
                        </div>
                    </div>
                    <div class="buffs-container" style="margin-top: 5px;">
                        <div class="buff-icon buff-shield" id="icon-shield"><i class="fa-solid fa-shield-halved"></i></div>
                        <div class="buff-icon buff-magnet" id="icon-magnet"><i class="fa-solid fa-magnet"></i></div>
                        <div class="buff-icon buff-laser" id="icon-laser"><i class="fa-solid fa-burst"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="start-screen" class="overlay">
            <h1 class="title">Stellar<br>Scavenger</h1>
            <p style="margin-bottom: 20px;">總資產: <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> <span id="start-wallet" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <div class="btn-group">
                <button class="btn" id="start-endless-btn">無盡模式 <i class="fa-solid fa-infinity"></i></button>
                <button class="btn" id="start-level-btn">關卡模式 <i class="fa-solid fa-flag-checkered"></i></button>
            </div>
            <button class="btn gold" id="open-shop-btn" style="margin-top: 10px;">星際商店 <i class="fa-solid fa-store"></i></button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h1 class="title">系統暫停</h1>
            <div class="btn-group" style="flex-direction: column; align-items: center; width: 220px;">
                <button class="btn" id="resume-btn" style="width: 100%;">繼續遊戲 <i class="fa-solid fa-play"></i></button>
                <button class="btn outline" id="restart-pause-btn" style="width: 100%;">重新部署 <i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn outline" id="home-pause-btn" style="width: 100%;">回主畫面 <i class="fa-solid fa-house"></i></button>
            </div>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h1 class="title" style="color: var(--danger-color); text-shadow: 0 0 20px var(--danger-color);">船體破裂</h1>
            <p id="trash-talk-msg" style="color: #ff8a80; font-size: 1rem; font-style: italic; margin-bottom: 15px; text-align: center; max-width: 85%; line-height: 1.4; min-height: 3rem; display: flex; align-items: center; justify-content: center行;"></p>
            <p style="font-size: 1.4rem; margin-bottom: 5px;">本次得分: <span id="final-score" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <p id="high-score-display" style="font-size: 1.1rem; margin-bottom: 5px; display: none;">最高紀錄: <span id="high-score-val" style="color: var(--primary-color); font-weight: bold;">0</span></p>
            <p style="font-size: 1.1rem; margin-bottom: 15px;">獲得水晶: <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> <span id="final-earned" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <p style="margin-bottom: 25px; font-size: 1.1rem; border-top: 1px solid #333; padding-top: 10px;">總資產結餘: <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> <span id="end-wallet" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <div class="btn-group">
                <button class="btn" id="restart-btn" style="border-color: var(--danger-color); color: var(--danger-color);">再次挑戰 <i class="fa-solid fa-rotate-right"></i></button>
                <button class="btn gold" id="open-shop-btn-end">商店 <i class="fa-solid fa-store"></i></button>
                <button class="btn outline" id="home-btn-lose">主畫面 <i class="fa-solid fa-house"></i></button>
            </div>
        </div>
        
        <div id="game-win-screen" class="overlay hidden">
            <h1 class="title" id="win-title" style="color: #34c759; text-shadow: 0 0 20px #34c759;">躍遷成功</h1>
            <p style="font-size: 1.1rem; margin-bottom: 10px; text-align: center;">能量已滿，順利突破當前空域！</p>
            <p style="font-size: 1.4rem; margin-bottom: 5px;">本次得分: <span id="win-score" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <p style="font-size: 1.1rem; margin-bottom: 15px;">獲得水晶: <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> <span id="win-earned" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <p style="margin-bottom: 25px; font-size: 1.1rem; border-top: 1px solid #333; padding-top: 10px;">總資產結餘: <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> <span id="win-end-wallet" style="color: var(--crystal-color); font-weight: bold;">0</span></p>
            <div class="btn-group">
                <button class="btn" id="next-level-btn" style="border-color: #34c759; color: #34c759;">前往下一關 <i class="fa-solid fa-forward-step"></i></button>
                <button class="btn gold" id="open-shop-btn-win">商店 <i class="fa-solid fa-store"></i></button>
                <button class="btn outline" id="home-btn-win">主畫面 <i class="fa-solid fa-house"></i></button>
            </div>
        </div>

        <div id="shop-screen" class="overlay hidden">
            <div class="shop-panel">
                <div class="shop-header">
                    <h2>星際補給站</h2>
                    <div style="font-size: 1.2rem;">
                        <i class="fa-solid fa-gem" style="color: var(--crystal-color);"></i> 
                        <span id="shop-wallet" style="color: var(--crystal-color); font-weight: bold;">0</span>
                    </div>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <h3>護盾升級 <span id="lvl-energy" style="color:#fff;">(Lv.1)</span></h3>
                        <p>提升飛船最大能量上限 (+25/級)</p>
                    </div>
                    <button class="shop-buy-btn" id="buy-energy">100 <i class="fa-solid fa-gem"></i></button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <h3>引擎優化 <span id="lvl-engine" style="color:#fff;">(Lv.1)</span></h3>
                        <p>減少自然消耗能量的速度 (-10%/級)</p>
                    </div>
                    <button class="shop-buy-btn" id="buy-engine">150 <i class="fa-solid fa-gem"></i></button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <h3>磁力強化 <span id="lvl-magnet" style="color:#fff;">(Lv.1)</span></h3>
                        <p>永久提升磁鐵吸取水晶的速度</p>
                    </div>
                    <button class="shop-buy-btn" id="buy-magnet">80 <i class="fa-solid fa-gem"></i></button>
                </div>
                <div class="shop-item">
                    <div class="shop-item-info">
                        <h3 style="color: #ff3b30;">赤紅塗裝 <span id="status-color-red" style="color:#fff;"></span></h3>
                        <p>專屬烈焰外觀，<span style="color: #ff8a80;">碰撞傷害減輕10點，水晶收益+20%</span></p>
                    </div>
                    <button class="shop-buy-btn" id="buy-color-red">500 <i class="fa-solid fa-gem"></i></button>
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn outline" id="close-shop-btn">離開商店 <i class="fa-solid fa-door-open"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1, slideFreq = null) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideFreq) {
                osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
            }
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            pickupNormal: () => playTone(1200, 'sine', 0.1, 0.1, 1600),
            pickupSpecial: () => { playTone(1500, 'square', 0.1, 0.1, 2000); setTimeout(() => playTone(2000, 'square', 0.2, 0.1, 3000), 100); },
            pickupItem: () => playTone(800, 'triangle', 0.3, 0.2, 1200),
            explosion: () => playTone(100, 'sawtooth', 0.5, 0.3, 10),
            shoot: () => playTone(800, 'square', 0.1, 0.05, 200),
            hit: () => playTone(300, 'sawtooth', 0.1, 0.1, 100),
            alarm: () => playTone(400, 'square', 0.2, 0.1),
            buy: () => { playTone(1000, 'sine', 0.1, 0.1); setTimeout(() => playTone(1500, 'sine', 0.2, 0.1), 100); }
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let gameLoopId;
        let isPlaying = false;
        let isPaused = false;
        let score = 0;
        let frameCount = 0;
        let difficultyMultiplier = 1;
        let screenShakeFrames = 0;
        
        let currentMode = 'endless';
        let currentLevel = 1;
        let endlessHighScore = 0;

        let totalCrystals = 0;
        let crystalsEarnedThisRound = 0;
        let playerUpgrades = {
            energyLvl: 1, engineLvl: 1, magnetLvl: 1, hasRedSkin: false, equippedSkin: 'default'
        };

        const trashTalkMessages = [
            "小行星：我有動？是你自己撞過來的喔。",
            "這操作，太空總署看了都想收回你的飛船駕照。",
            "燃料還很多，但你的靈性走位已經見底了。",
            "別看了，剛才撞你的那顆隕石也在笑你。",
            "船體雖然破裂了，但至少你的分數...也很破爛。",
            "你是在練習太空船的 100 種大爆炸物理測試嗎？",
            "剛才那一下，完美演繹了什麼叫『用生命在撿垃圾』。",
            "沒事，失敗是成功之母，但你這局看起來像是絕嗣了。",
            "你的飛船噴漆很酷，可惜駕駛員只是個隨機碰撞器。",
            "剛才是不是有太空蚊子掉到你眼睛裡？",
            "外星人剛剛路過，順便給你的走位點了個踩。",
            "下一局要不要考慮把眼睛張開玩？",
            "飛船是無辜的，它這輩子最後悔的就是載到你。",
            "如果你是AI，你現在已經被集體格式化了。",
            "要不要去商店買個『新手教學』？啊，商店沒賣這個。",
            "你跟小行星之間是有什麼相吸的磁場嗎？",
            "看來你對『避開』這兩個字的理解跟常人不太一樣。",
            "這不是躍遷失敗，這是全自動星際拆船技術示範。",
            "恭喜獲得成就：『太空煙火秀首席贊助商』！",
            "你的極限閃避，成功閃開了所有正確的安全路線。",
            "宇宙這麼大，你偏偏選擇了撞上最小的那顆隕石。",
            "剛才那個完美的死亡弧線，我給 8.7 分，不能再多了。",
            "小行星帶表示：感謝大自然的饋贈，又有太空垃圾送上門了。",
            "建議下一局改用滑鼠左鍵狂點試試看，可能都比現在靈活。",
            "看來你對宇宙的唯一貢獻，就是製造了更多的星際碎片。",
            "你是來星際拾荒的，還是來給外星人表演當場去世的？",
            "剛才那顆隕石說它根本沒用力，是用戶自己倒貼的。",
            "這技術，連黑洞看了都嫌棄，想把你吐出來。",
            "如果手殘是一種超能力，你現在已經是復仇者聯盟主席了。",
            "有想過換個遊戲玩嗎？比如踩地雷可能比較適合你。"
        ];

        try {
            let savedWallet = localStorage.getItem('stellar_wallet');
            if (savedWallet) totalCrystals = parseInt(savedWallet) || 0;
            
            let savedHS = localStorage.getItem('stellar_highscore');
            if (savedHS) endlessHighScore = parseInt(savedHS) || 0;

            let savedUpgrades = JSON.parse(localStorage.getItem('stellar_upgrades'));
            if (savedUpgrades) playerUpgrades = { ...playerUpgrades, ...savedUpgrades };
        } catch (e) {
            console.warn("無法存取 LocalStorage 存檔。");
        }

        function getMaxEnergy() { return 100 + (playerUpgrades.energyLvl - 1) * 25; }
        function getEngineDrain() { return 2 * Math.pow(0.9, playerUpgrades.engineLvl - 1); }
        function getMagnetSpeed() { return 12 + (playerUpgrades.magnetLvl - 1) * 3; } 
        function getLevelTarget() { return currentLevel * 500; } 
        
        let energy = getMaxEnergy();

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function random(min, max) { return Math.random() * (max - min) + min; }
        function checkCollision(obj1, obj2) {
            const dx = obj1.x - obj2.x;
            const dy = obj1.y - obj2.y;
            return Math.sqrt(dx * dx + dy * dy) < (obj1.radius || obj1.size) + (obj2.radius || obj2.size);
        }

        class Star {
            constructor() { this.reset(); this.y = random(0, canvas.height); }
            reset() { this.x = random(0, canvas.width); this.y = -10; this.size = random(1, 2.5); this.speed = this.size * random(1, 2); }
            update() { this.y += this.speed * (isPlaying && !isPaused ? (1 + score/100) : 1); if (this.y > canvas.height) this.reset(); }
            draw() { 
                // 優化：Star.draw() 不再各自呼叫 fillStyle，由核心主迴圈統一著色
                ctx.fillRect(this.x, this.y, this.size, this.size); 
            }
        }

        class Particle {
            constructor(x, y, color, isExplosion, isTrail = false) {
                this.x = x; this.y = y; this.color = color;
                this.radius = isTrail ? random(1, 1.8) : random(1.8, 3.2);
                const angle = random(0, Math.PI * 2);
                const speed = isExplosion ? random(2, 5.5) : random(0.5, 1.2);
                this.vx = Math.cos(angle) * speed;
                this.vy = isTrail ? random(1, 2) : Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = isTrail ? random(0.06, 0.12) : random(0.03, 0.07);
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.life -= this.decay;
                if (this.life <= 0) this.markedForDeletion = true;
            }
            draw() {
                // 手機版優化：直接利用尺寸縮放代替 Alpha 透明度變更，大幅提升手機解算速度
                ctx.fillStyle = this.color;
                const sz = this.radius * (isMobileDevice ? this.life : 1);
                if (!isMobileDevice) ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillRect(this.x - sz, this.y - sz, sz * 2, sz * 2);
                if (!isMobileDevice) ctx.globalAlpha = 1.0;
            }
        }

        class Projectile {
            constructor(x, y) {
                this.x = x; this.y = y; this.radius = 3.5;
                this.speedY = -10; this.markedForDeletion = false;
            }
            update() {
                this.y += this.speedY;
                if (this.y < -10) this.markedForDeletion = true;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff1744';
                ctx.fill(); 
            }
        }

        class Player {
            constructor() {
                this.radius = 14;
                this.reset();
                this.speed = 0.22; 
            }
            reset() {
                this.x = canvas.width / 2; this.y = canvas.height * 0.8;
                this.targetX = this.x; this.targetY = this.y;
                this.thrustFrames = 0;
                this.buffs = { shield: 0, magnet: 0, laser: 0 };
            }
            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                this.thrustFrames++;

                let trailRate = isMobileDevice ? 5 : 2;
                if (isPlaying && !isPaused && this.thrustFrames % trailRate === 0) {
                    if (isMobileDevice && particles.length > 10) return; // 嚴格控制手機端粒子上限
                    const trailColor = playerUpgrades.equippedSkin === 'red' ? '#ff3b30' : '#b388ff';
                    particles.push(new Particle(this.x + random(-3, 3), this.y + 8, trailColor, false, true));
                }

                for (let buff in this.buffs) {
                    if (this.buffs[buff] > 0) {
                        this.buffs[buff]--;
                        if (this.buffs[buff] === 0) updateBuffUI(); 
                    }
                }

                if (this.buffs.laser > 0 && this.thrustFrames % 15 === 0) {
                    projectiles.push(new Projectile(this.x, this.y - 20));
                    SFX.shoot();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const tilt = (this.targetX - this.x) * 0.05;
                ctx.rotate(tilt);

                if (this.buffs.magnet > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 20 + Math.sin(this.thrustFrames * 0.1) * 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(179, 136, 255, 0.06)'; ctx.fill();
                    ctx.strokeStyle = 'rgba(179, 136, 255, 0.3)'; ctx.lineWidth = 1; ctx.stroke();
                }

                ctx.beginPath();
                ctx.moveTo(0, -this.radius * 1.5); 
                ctx.lineTo(this.radius, this.radius);  
                ctx.lineTo(0, this.radius * 0.5);   
                ctx.lineTo(-this.radius, this.radius); 
                ctx.closePath();
                
                // 手機端極限優化：完全捨棄 Gradient 動態物件創建，改用高對比純色渲染，防止記憶體回收停頓
                if (isMobileDevice) {
                    ctx.fillStyle = playerUpgrades.equippedSkin === 'red' ? '#ff3b30' : '#b388ff';
                } else {
                    const gradient = ctx.createLinearGradient(0, -this.radius*1.5, 0, this.radius);
                    gradient.addColorStop(0, '#ffffff');
                    if (playerUpgrades.equippedSkin === 'red') {
                        gradient.addColorStop(0.3, '#ff3b30'); gradient.addColorStop(1, '#8a0000');
                        ctx.shadowColor = '#ff3b30'; ctx.shadowBlur = 25;
                    } else {
                        gradient.addColorStop(0.3, '#b388ff'); gradient.addColorStop(1, '#7c4dff');
                        ctx.shadowColor = '#b388ff'; ctx.shadowBlur = 15;
                    }
                    ctx.fillStyle = gradient;
                }
                
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

                if (this.thrustFrames % 4 < 2) {
                    ctx.beginPath(); ctx.moveTo(-this.radius * 0.5, this.radius * 0.8);
                    const flameLen = playerUpgrades.equippedSkin === 'red' ? random(5, 12) : random(0, 8);
                    ctx.lineTo(0, this.radius * 1.7 + flameLen); 
                    ctx.lineTo(this.radius * 0.5, this.radius * 0.8);
                    ctx.fillStyle = playerUpgrades.equippedSkin === 'red' ? '#ff3b30' : 'rgba(179, 136, 255, 0.8)'; 
                    ctx.fill();
                }

                if (this.buffs.shield > 0) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2.5; 
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.12)'; ctx.fill(); ctx.stroke();
                }

                ctx.restore();
            }
        }

        class Asteroid {
            constructor() {
                this.radius = random(14, 28);
                this.x = random(this.radius, canvas.width - this.radius);
                this.y = -this.radius - 50;
                this.speedY = random(2, 4) * difficultyMultiplier;
                this.speedX = random(-0.6, 0.6) * difficultyMultiplier;
                this.rotation = random(0, Math.PI * 2);
                this.rotationSpeed = random(-0.03, 0.03);
                this.vertices = Math.floor(random(5, 7));
                this.offsets = Array.from({length: this.vertices}, () => random(0.8, 1.1));
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY; this.rotation += this.rotationSpeed;
                if (this.x < -this.radius) this.x = canvas.width + this.radius;
                if (this.x > canvas.width + this.radius) this.x = -this.radius;
                if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.fillStyle = '#5c6066'; 
                
                // 手機端極限優化：隕石直接畫完美方形填充，完全免去複雜幾何路徑動態解算
                if (isMobileDevice) {
                    ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.beginPath();
                    for (let i = 0; i < this.vertices; i++) {
                        const angle = (i / this.vertices) * Math.PI * 2;
                        const r = this.radius * this.offsets[i];
                        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Crystal {
            constructor() {
                this.radius = 11;
                this.x = random(this.radius, canvas.width - this.radius);
                this.y = -this.radius;
                this.speedY = random(2, 3.5) * difficultyMultiplier;
                this.type = Math.random() > 0.9 ? 'special' : 'normal'; 
                this.markedForDeletion = false;
                this.rotation = 0;
            }
            update(playerX, playerY, magnetActive) {
                if (magnetActive) {
                    const dx = playerX - this.x; const dy = playerY - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 0.5) {
                        const speed = getMagnetSpeed();
                        this.x += (dx / dist) * speed; 
                        this.y += (dy / dist) * speed;
                        this.rotation += 0.2;
                        return; 
                    }
                }
                this.y += this.speedY; this.rotation += 0.05;
                if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.fillStyle = this.type === 'special' ? '#ff3b30' : '#ffd700';
                ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(this.radius * 0.7, 0);
                ctx.lineTo(0, this.radius); ctx.lineTo(-this.radius * 0.7, 0); ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class PowerUp {
            constructor() {
                this.radius = 14;
                this.x = random(this.radius, canvas.width - this.radius);
                this.y = -this.radius;
                this.speedY = random(1.5, 2.5);
                const types = ['shield', 'magnet', 'laser', 'bomb'];
                this.type = types[Math.floor(Math.random() * types.length)];
                this.markedForDeletion = false;
                this.pulse = 0;
            }
            update() {
                this.y += this.speedY; this.pulse += 0.08;
                if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                const scale = 1 + Math.sin(this.pulse) * 0.08;
                ctx.scale(scale, scale);
                
                let color, icon;
                if(this.type === 'shield') { color = '#00e5ff'; icon = '\uf3ed'; } 
                else if(this.type === 'magnet') { color = '#b388ff'; icon = '\uf076'; } 
                else if(this.type === 'laser') { color = '#ff1744'; icon = '\ue4dc'; } 
                else { color = '#ff9100'; icon = '\uf1e2'; } 

                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${parseInt(color.slice(1,3),16)},${parseInt(color.slice(3,5),16)},${parseInt(color.slice(5,7),16)},0.2)`;
                ctx.strokeStyle = color; ctx.lineWidth = 2; 
                ctx.fill(); ctx.stroke();

                ctx.font = '900 13px "Font Awesome 6 Free"';
                ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(icon, 0, 0);
                ctx.restore();
            }
        }

        let player = new Player();
        let maxStars = isMobileDevice ? 25 : 75; 
        let backgroundStars = Array.from({length: maxStars}, () => new Star());
        let asteroids = [];
        let crystals = [];
        let powerups = [];
        let particles = [];
        let projectiles = [];

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying || isPaused) return;
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left; player.targetY = e.clientY - rect.top;
        });

        // 核心優化：觸控追蹤直接無條件綁定在頂層 window，破除任何 HTML 排版外框的隱形點擊攔截！
        window.addEventListener('touchstart', handleTouch, { passive: false });
        window.addEventListener('touchmove', handleTouch, { passive: false });

        function handleTouch(e) {
            if (!isPlaying || isPaused) return;
            
            // 唯有在非按鈕點擊時才進行阻斷傳遞與跟隨
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('.stat-box')) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                player.targetX = touch.clientX - rect.left;
                player.targetY = touch.clientY - rect.top;
            }
        }

        function createParticles(x, y, color, isExplosion, count) {
            let finalCount = isMobileDevice ? Math.floor(count * 0.35) : count;
            for (let i = 0; i < finalCount; i++) particles.push(new Particle(x, y, color, isExplosion));
        }

        function triggerScreenShake(frames) {
            if (isMobileDevice) return; // 手機端直接關閉鏡頭震動防止過載
            screenShakeFrames = frames;
            container.classList.add('screen-shake');
            setTimeout(() => container.classList.remove('screen-shake'), 400);
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('mode-display').innerText = currentMode === 'endless' ? '無盡模式' : `第 ${currentLevel} 關`;
            const targetScoreUI = document.getElementById('target-score');
            const highScoreUI = document.getElementById('hud-high-score');

            if(currentMode === 'level') {
                targetScoreUI.style.display = 'inline';
                targetScoreUI.innerText = `/ ${getLevelTarget()}`;
                highScoreUI.style.display = 'none';
            } else {
                targetScoreUI.style.display = 'none';
                highScoreUI.style.display = 'inline';
                highScoreUI.innerText = `最高: ${Math.max(score, endlessHighScore)}`;
            }

            const energyFill = document.getElementById('energy-fill');
            const max = getMaxEnergy();
            const percentage = Math.max(0, (energy / max) * 100);
            energyFill.style.width = `${percentage}%`;
            document.getElementById('energy-text-val').innerText = Math.floor(energy);
            document.getElementById('energy-text-max').innerText = max;

            if (percentage < 25) {
                energyFill.style.background = 'var(--danger-color)';
                if (!isPaused && frameCount % 30 === 0) SFX.alarm(); 
            } else {
                energyFill.style.background = 'linear-gradient(90deg, #ff3b30, #ffcc00, #34c759)';
            }
            document.getElementById('hud-wallet').innerText = totalCrystals;
        }

        function updateBuffUI() {
            document.getElementById('icon-shield').classList.toggle('active', player.buffs.shield > 0);
            document.getElementById('icon-magnet').classList.toggle('active', player.buffs.magnet > 0);
            document.getElementById('icon-laser').classList.toggle('active', player.buffs.laser > 0);
        }

        function spawnEntities() {
            const spawnRate = Math.max(15, 50 - score / 100);
            if (frameCount % Math.floor(spawnRate) === 0) asteroids.push(new Asteroid());
            if (frameCount % 45 === 0) crystals.push(new Crystal());
            
            if (frameCount > 0 && frameCount % 600 === 0) {
                powerups.push(new PowerUp());
            }
        }

        function update() {
            if (!isPlaying || isPaused) return;
            frameCount++;
            
            if (currentMode === 'level') {
                difficultyMultiplier = 1 + (currentLevel * 0.2) + (score / 1000);
            } else {
                difficultyMultiplier = 1 + (score / 800); 
            }

            if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= 7;
            if (keys['ArrowRight'] || keys['KeyD']) player.targetX += 7;
            if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= 7;
            if (keys['ArrowDown'] || keys['KeyS']) player.targetY += 7;

            player.update();
            
            if (frameCount % 60 === 0) {
                energy -= getEngineDrain() * difficultyMultiplier;
                updateUI();
            }

            if (energy <= 0) { gameOver(); return; }

            spawnEntities();
            backgroundStars.forEach(star => star.update());

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i]; p.update();
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    let a = asteroids[j];
                    if (checkCollision(p, a)) {
                        createParticles(a.x, a.y, '#5c6066', true, 10);
                        createParticles(p.x, p.y, '#ff1744', true, 3);
                        SFX.hit();
                        
                        let shootEarn = playerUpgrades.equippedSkin === 'red' ? 6 : 5;
                        score += shootEarn; 
                        totalCrystals += shootEarn; 
                        crystalsEarnedThisRound += shootEarn;

                        a.markedForDeletion = true;
                        p.markedForDeletion = true;
                        checkLevelWin();
                        break;
                    }
                }
                if (p.markedForDeletion) projectiles.splice(i, 1);
            }

            for (let i = asteroids.length - 1; i >= 0; i--) {
                let ast = asteroids[i]; ast.update();
                if (checkCollision(player, ast)) {
                    ast.markedForDeletion = true;
                    
                    if (player.buffs.shield > 0) {
                        player.buffs.shield = 0;
                        updateBuffUI();
                        createParticles(ast.x, ast.y, '#00e5ff', true, 15);
                        SFX.hit();
                    } else {
                        createParticles(player.x, player.y, '#b388ff', true, 10);
                        createParticles(ast.x, ast.y, '#5c6066', true, 10);
                        
                        let dmg = playerUpgrades.equippedSkin === 'red' ? 20 : 30;
                        energy -= dmg;
                        
                        SFX.explosion();
                        if (energy <= 0) { gameOver(); return; }
                    }
                    updateUI();
                }
                if (ast.markedForDeletion) asteroids.splice(i, 1);
            }

            for (let i = crystals.length - 1; i >= 0; i--) {
                let cry = crystals[i];
                cry.update(player.x, player.y, player.buffs.magnet > 0);
                if (checkCollision(player, cry)) {
                    let isSpecial = cry.type === 'special';
                    createParticles(cry.x, cry.y, isSpecial ? '#ff3b30' : '#ffd700', false, 6);
                    
                    let baseEarn = isSpecial ? 50 : 10;
                    let earned = playerUpgrades.equippedSkin === 'red' ? Math.floor(baseEarn * 1.2) : baseEarn;
                    
                    score += earned;
                    totalCrystals += earned; 
                    crystalsEarnedThisRound += earned;
                    
                    energy = Math.min(getMaxEnergy(), energy + (isSpecial ? 25 : 10));
                    
                    isSpecial ? SFX.pickupSpecial() : SFX.pickupNormal();
                    updateUI();
                    cry.markedForDeletion = true;
                    checkLevelWin();
                }
                if (cry.markedForDeletion) crystals.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i]; pu.update();
                if (checkCollision(player, pu)) {
                    createParticles(pu.x, pu.y, '#ffffff', true, 10);
                    SFX.pickupItem();
                    
                    if (pu.type === 'bomb') {
                        asteroids.forEach(a => {
                            createParticles(a.x, a.y, '#5c6066', true, 8);
                            a.markedForDeletion = true;
                            let bombEarn = playerUpgrades.equippedSkin === 'red' ? 6 : 5;
                            score += bombEarn; 
                            totalCrystals += bombEarn;
                            crystalsEarnedThisRound += bombEarn;
                        });
                        SFX.explosion();
                        updateUI();
                        checkLevelWin();
                    } else {
                        if(pu.type === 'shield') player.buffs.shield = 600;
                        if(pu.type === 'magnet') player.buffs.magnet = 600;
                        if(pu.type === 'laser') player.buffs.laser = 600;
                        updateBuffUI();
                    }
                    pu.markedForDeletion = true;
                }
                if (pu.markedForDeletion) powerups.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].markedForDeletion) particles.splice(i, 1);
            }
        }

        function checkLevelWin() {
            if (currentMode === 'level' && score >= getLevelTarget() && isPlaying && !isPaused) {
                gameWin();
            }
        }

        function draw() {
            // 核心優化：切斷硬體陰影模糊解算，拔除超重負載
            ctx.shadowBlur = 0;
            ctx.shadowColor = "transparent";

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            // 星空 Batch Rendering 優化：統一樣式，不重複變更 ctx 樣式管線
            ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
            backgroundStars.forEach(star => star.draw());

            if (isPlaying) {
                particles.forEach(p => p.draw());
                projectiles.forEach(p => p.draw());
                crystals.forEach(c => c.draw());
                powerups.forEach(p => p.draw());
                asteroids.forEach(a => a.draw());
                player.draw();
            } else {
                 backgroundStars.forEach(star => star.update());
            }
            ctx.restore();
        }

        function gameLoop() {
            update(); draw();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function initGame() {
            score = 0; crystalsEarnedThisRound = 0; 
            energy = getMaxEnergy(); frameCount = 0; difficultyMultiplier = 1; screenShakeFrames = 0;
            isPaused = false;
            player.reset(); updateBuffUI(); updateUI();
            asteroids = []; crystals = []; powerups = []; particles = []; projectiles = [];
        }

        function startGame(mode, keepLevel = false) {
            currentMode = mode;
            if (mode === 'level' && !keepLevel) {
                currentLevel = 1; 
            }
            initAudio(); initGame();
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-earned').innerText = crystalsEarnedThisRound;
            document.getElementById('end-wallet').innerText = totalCrystals;
            
            const randomMsg = trashTalkMessages[Math.floor(Math.random() * trashTalkMessages.length)];
            document.getElementById('trash-talk-msg').innerText = `「 ${randomMsg} 」`;

            if (currentMode === 'endless') {
                if (score > endlessHighScore) {
                    endlessHighScore = score;
                }
                document.getElementById('high-score-display').style.display = 'block';
                document.getElementById('high-score-val').innerText = endlessHighScore;
            } else {
                document.getElementById('high-score-display').style.display = 'none';
            }

            document.getElementById('game-over-screen').classList.remove('hidden');
            
            const expColor = playerUpgrades.equippedSkin === 'red' ? '#ff3b30' : '#b388ff';
            createParticles(player.x, player.y, expColor, true, 25);
            SFX.explosion(); draw();
            saveGame();
        }

        function gameWin() {
            isPlaying = false;
            document.getElementById('win-title').innerText = `第 ${currentLevel} 關 躍遷成功`;
            document.getElementById('win-score').innerText = score;
            document.getElementById('win-earned').innerText = crystalsEarnedThisRound; 
            document.getElementById('win-end-wallet').innerText = totalCrystals;
            document.getElementById('game-win-screen').classList.remove('hidden');
            
            createParticles(player.x, player.y, '#34c759', true, 30);
            SFX.pickupSpecial(); draw();
            saveGame();
        }

        function goHome() {
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            document.getElementById('start-screen').classList.remove('hidden');
            updateWalletUI(); 
        }

        function updateWalletUI() {
            document.getElementById('start-wallet').innerText = totalCrystals;
            document.getElementById('hud-wallet').innerText = totalCrystals;
            document.getElementById('shop-wallet').innerText = totalCrystals;
            
            const energyCost = 100 * playerUpgrades.energyLvl;
            const btnEnergy = document.getElementById('buy-energy');
            document.getElementById('lvl-energy').innerText = `(Lv.${playerUpgrades.energyLvl})`;
            if(playerUpgrades.energyLvl >= 5) { btnEnergy.innerText = "MAX"; btnEnergy.disabled = true; }
            else { btnEnergy.innerHTML = `${energyCost} <i class="fa-solid fa-gem"></i>`; btnEnergy.disabled = totalCrystals < energyCost; }

            const engineCost = 150 * playerUpgrades.engineLvl;
            const btnEngine = document.getElementById('buy-engine');
            document.getElementById('lvl-engine').innerText = `(Lv.${playerUpgrades.engineLvl})`;
            if(playerUpgrades.engineLvl >= 5) { btnEngine.innerText = "MAX"; btnEngine.disabled = true; }
            else { btnEngine.innerHTML = `${engineCost} <i class="fa-solid fa-gem"></i>`; btnEngine.disabled = totalCrystals < engineCost; }

            const magnetCost = 80 * playerUpgrades.magnetLvl;
            const btnMagnet = document.getElementById('buy-magnet');
            document.getElementById('lvl-magnet').innerText = `(Lv.${playerUpgrades.magnetLvl})`;
            if(playerUpgrades.magnetLvl >= 5) { btnMagnet.innerText = "MAX"; btnMagnet.disabled = true; }
            else { btnMagnet.innerHTML = `${magnetCost} <i class="fa-solid fa-gem"></i>`; btnMagnet.disabled = totalCrystals < magnetCost; }

            const btnRed = document.getElementById('buy-color-red');
            if(playerUpgrades.hasRedSkin) {
                if(playerUpgrades.equippedSkin === 'red') {
                    btnRed.innerText = "已裝備"; btnRed.disabled = true;
                } else {
                    btnRed.innerText = "裝備"; btnRed.disabled = false;
                }
                document.getElementById('status-color-red').innerText = "(已解鎖)";
            } else {
                btnRed.innerHTML = `500 <i class="fa-solid fa-gem"></i>`;
                btnRed.disabled = totalCrystals < 500;
            }
        }

        function openShop() {
            initAudio(); updateWalletUI();
            document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
            document.getElementById('shop-screen').classList.remove('hidden');
        }

        function closeShop() {
            document.getElementById('shop-screen').classList.add('hidden');
            if (score === 0 && energy === getMaxEnergy()) document.getElementById('start-screen').classList.remove('hidden');
            else if (currentMode === 'level' && score >= getLevelTarget()) document.getElementById('game-win-screen').classList.remove('hidden');
            else document.getElementById('game-over-screen').classList.remove('hidden');
        }

        document.getElementById('pause-btn').addEventListener('click', (e) => {
            if (isPlaying && !isPaused) {
                isPaused = true;
                document.getElementById('pause-screen').classList.remove('hidden');
            }
        });
        document.getElementById('resume-btn').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('pause-screen').classList.add('hidden');
        });
        document.getElementById('restart-pause-btn').addEventListener('click', () => {
            isPaused = false;
            startGame(currentMode, false);
        });
        document.getElementById('home-pause-btn').addEventListener('click', () => {
            isPaused = false;
            isPlaying = false;
            goHome();
        });

        document.getElementById('buy-energy').addEventListener('click', () => {
            const cost = 100 * playerUpgrades.energyLvl;
            if(totalCrystals >= cost && playerUpgrades.energyLvl < 5) {
                totalCrystals -= cost; playerUpgrades.energyLvl++; SFX.buy(); saveGame(); updateWalletUI();
            }
        });
        document.getElementById('buy-engine').addEventListener('click', () => {
            const cost = 150 * playerUpgrades.engineLvl;
            if(totalCrystals >= cost && playerUpgrades.engineLvl < 5) {
                totalCrystals -= cost; playerUpgrades.engineLvl++; SFX.buy(); saveGame(); updateWalletUI();
            }
        });
        document.getElementById('buy-magnet').addEventListener('click', () => {
            const cost = 80 * playerUpgrades.magnetLvl;
            if(totalCrystals >= cost && playerUpgrades.magnetLvl < 5) {
                totalCrystals -= cost; playerUpgrades.magnetLvl++; SFX.buy(); saveGame(); updateWalletUI();
            }
        });
        document.getElementById('buy-color-red').addEventListener('click', () => {
            if(!playerUpgrades.hasRedSkin && totalCrystals >= 500) {
                totalCrystals -= 500; playerUpgrades.hasRedSkin = true; playerUpgrades.equippedSkin = 'red'; SFX.buy(); saveGame(); updateWalletUI();
            } else if (playerUpgrades.hasRedSkin) {
                playerUpgrades.equippedSkin = 'red'; SFX.buy(); saveGame(); updateWalletUI();
            }
        });

        document.getElementById('start-endless-btn').addEventListener('click', () => startGame('endless'));
        document.getElementById('start-level-btn').addEventListener('click', () => startGame('level'));
        document.getElementById('restart-btn').addEventListener('click', () => startGame(currentMode, false));
        document.getElementById('next-level-btn').addEventListener('click', () => {
            currentLevel++; 
            startGame('level', true); 
        });
        
        document.getElementById('home-btn-lose').addEventListener('click', goHome);
        document.getElementById('home-btn-win').addEventListener('click', goHome);

        document.getElementById('open-shop-btn').addEventListener('click', openShop);
        document.getElementById('open-shop-btn-end').addEventListener('click', openShop);
        document.getElementById('open-shop-btn-win').addEventListener('click', openShop);
        document.getElementById('close-shop-btn').addEventListener('click', closeShop);

        updateWalletUI();
        gameLoop();

    </script>
</body>
</html>
